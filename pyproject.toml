[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldpan"
version = "0.1.0"
description = "Gated Object-Localization & Detection for Pigment cell ANalysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "braedanmc" }]
keywords = ["microscopy", "segmentation", "pigment-cells", "zebrafish", "image-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Private :: Do Not Upload",
]
# Runtime dependencies are provided by the `laya` conda env (see environment.yml).
# Listed here for metadata completeness; install via conda, not pip, for the
# compiled stack (cv2/skimage/scipy).
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "opencv-python",
    "matplotlib",
    "tifffile",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[project.scripts]
goldpan = "goldpan.driver:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
